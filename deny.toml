# cargo-deny: what CI checks about dependencies (see .github/workflows/ci.yml).
# Run locally with `cargo deny check`.

[graph]
# Heimdall ships for Windows and Linux: check what both builds pull in.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Any RustSec advisory (vulnerable, unmaintained, unsound, yanked) fails the
# build. A known-harmless one goes in `ignore` with the reason next to it.
version = 2
yanked = "deny"
ignore = [
    # From egui 0.31 (epaint -> ab_glyph). "Unmaintained" is not a known
    # vulnerability: `ttf-parser` only reads the fonts bundled in the
    # executable, never a file from outside. Drop it when egui moves on.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: only parses bundled fonts, via egui" },
    # Linux only. zbus 5's helper crates were folded into zbus 6, so they
    # are "unmaintained" with no vulnerability. zbus 5 comes with rfd's file
    # dialog (xdg portal) and Heimdall's logind listener uses the same copy.
    # Drop these when rfd moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6, no vulnerability; via rfd" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6, no vulnerability; via rfd" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6, no vulnerability; via rfd" },
]

[licenses]
# Everything must be compatible with Heimdall's GPL-3.0-only.
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0-only", # Heimdall itself
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # egui's bundled default fonts (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
# Several versions of one crate only warn (the GUI stack has a few);
# wildcard version requirements are refused.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
