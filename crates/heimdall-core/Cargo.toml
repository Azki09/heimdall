[package]
name = "heimdall-core"
description = "Heimdall vault core: cryptography, the .heim format, key slots and the note model. No UI, no OS code."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
uuid = { version = "1", features = ["v4", "serde"] }
bip39 = { version = "2", features = ["zeroize"] }
thiserror = "2"

[features]
# Exposes `heimdall_core::fuzzing` for the fuzz targets in `fuzz/`.
fuzzing = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
