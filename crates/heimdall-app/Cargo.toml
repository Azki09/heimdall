[package]
name = "heimdall-app"
description = "Heimdall: an encrypted notepad. No signal. No trace."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "heimdall"
path = "src/main.rs"

[dependencies]
heimdall-core = { path = "../heimdall-core" }
heimdall-platform = { path = "../heimdall-platform" }
# Without "accesskit": no screen reader support, on purpose (DESIGN §10.10).
# It would publish the note text to any program in the session (UI
# Automation on Windows, AT-SPI on Linux).
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# What eframe's default features turned on in winit (Wayland loaded at run
# time, not linked).
winit = "0.30"
rfd = "0.15"
arboard = { version = "3", default-features = false }
zxcvbn = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zeroize = "1.8"
uuid = "1"
spellbook = "0.4"
raw-window-handle = "0.6"
flate2 = "1"
crc32fast = "1"
unicode-width = "0.2"
sha2 = "0.11"

[build-dependencies]
winresource = "0.1"

# Wayland clipboards that speak wlr-data-control; others go through X11.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# "use-dev-tty": crossterm's other reader, which stops when the terminal
# goes away; the default one spins forever on a closed terminal.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "use-dev-tty"] }
signal-hook = { version = "0.3", default-features = false }

[lints]
workspace = true
