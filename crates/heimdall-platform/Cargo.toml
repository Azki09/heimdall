[package]
name = "heimdall-platform"
description = "Heimdall OS-specific code: USB drives, printing, session events and process hardening (Windows and Linux)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# The only crate allowed to call the OS through FFI. `unsafe` is denied
# (not forbidden) so the Windows module can opt in, with a SAFETY note on
# every block.
[lints.rust]
unsafe_code = "deny"
