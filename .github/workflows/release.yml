# Pushing a tag like v1.2.1 builds Heimdall on GitHub's runners for Windows
# (heimdall.exe) and Linux (an AppImage, a .deb and a .tar.gz), and publishes them
# with their SHA-256 and a build provenance attestation that ties each file
# to this commit and this workflow run.
# Users verify with Get-FileHash / sha256sum and `gh attestation verify`
# (SECURITY.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        # Static C runtime: runs on a clean Windows without VCRUNTIME140.dll.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p heimdall-app
      - name: Check that only system DLLs are needed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target/release/heimdall.exe | Select-String '\.dll'
          $deps
          if ($deps -match 'vcruntime|msvcp|api-ms-win-crt|ucrtbase') { throw "heimdall.exe depends on the C runtime DLLs" }
      - name: Keep the unsigned build
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: heimdall-unsigned
          path: target/release/heimdall.exe
          if-no-files-found: error
      # Code signing through SignPath Foundation (free for open source).
      # Runs only once the project is approved and the repository has the
      # SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret.
      # Until then releases are unsigned (hash + attestation only).
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: heimdall
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          if (Test-Path signed/heimdall.exe) {
            Copy-Item signed/heimdall.exe dist/
          } else {
            Copy-Item target/release/heimdall.exe dist/
          }
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

  linux:
    name: Build for Linux
    # The oldest supported runner: the binary runs on any newer glibc
    # (Ubuntu 22.04, Debian 12, Fedora 36 and later).
    runs-on: ubuntu-22.04
    env:
      # Pinned by version and hash. appimagetool is given the runtime file,
      # so it downloads nothing else.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p heimdall-app
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          strip target/release/heimdall

          # .tar.gz: the executable, its desktop entry and icon, the
          # per-user install.sh / uninstall.sh, the license.
          pkg="heimdall-$version-linux-x86_64"
          mkdir "$pkg"
          cp target/release/heimdall packaging/linux/heimdall.desktop packaging/linux/heimdall.png \
            packaging/linux/install.sh packaging/linux/uninstall.sh LICENSE README.md "$pkg/"
          chmod 755 "$pkg/heimdall" "$pkg/install.sh" "$pkg/uninstall.sh"
          tar --owner=0 --group=0 -czf "dist/$pkg.tar.gz" "$pkg"

          # .deb for Debian, Ubuntu and Mint. Built with dpkg-deb (already
          # on the runner, nothing to download). No maintainer scripts:
          # dpkg's own triggers refresh the app menu and the icon cache.
          deb=debroot
          install -D -m 755 target/release/heimdall "$deb/usr/bin/heimdall"
          install -D -m 644 packaging/linux/heimdall.desktop "$deb/usr/share/applications/heimdall.desktop"
          install -D -m 644 packaging/linux/heimdall.png "$deb/usr/share/icons/hicolor/512x512/apps/heimdall.png"
          install -D -m 644 packaging/linux/copyright "$deb/usr/share/doc/heimdall/copyright"
          # Libraries the binary links against, as package names, plus the
          # ones winit and glutin load at run time (dpkg-shlibdeps can't
          # see those).
          mkdir -p shlibs/debian && touch shlibs/debian/control
          linked=$(cd shlibs && dpkg-shlibdeps -O "$GITHUB_WORKSPACE/target/release/heimdall" | sed 's/^shlibs:Depends=//')
          runtime="libegl1, libgl1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libx11-6, libxcursor1, libxi6, libxkbcommon0, libxkbcommon-x11-0, libxrandr2"
          debver=$(printf '%s' "$version" | tr - '~')   # 1.3.0-rc1 sorts before 1.3.0
          mkdir -p "$deb/DEBIAN"
          cat > "$deb/DEBIAN/control" <<EOF
          Package: heimdall
          Version: $debver
          Architecture: amd64
          Maintainer: Azki09 <72277529+Azki09@users.noreply.github.com>
          Installed-Size: $(du -sk "$deb/usr" | cut -f1)
          Depends: $linked, $runtime
          Conflicts: heimdall-flash
          Section: utils
          Priority: optional
          Homepage: https://github.com/$GITHUB_REPOSITORY
          Description: Encrypted, offline notepad
           Heimdall is as simple as Notepad, but everything you write is saved
           encrypted in a single .heim file that only opens with your password
           (and, if you want, a USB key). It never connects to the internet.
          EOF
          chmod 644 "$deb/DEBIAN/control"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            dpkg-deb --root-owner-group -Zxz --build "$deb" "dist/heimdall_${version}_amd64.deb"
          dpkg-deb --info "dist/heimdall_${version}_amd64.deb"
          dpkg-deb --contents "dist/heimdall_${version}_amd64.deb"

          # AppImage: one file that runs on its own.
          curl -sSfL -o appimagetool "$APPIMAGETOOL_URL"
          curl -sSfL -o runtime "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          echo "$RUNTIME_SHA256  runtime" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp target/release/heimdall AppDir/usr/bin/
          cp packaging/linux/heimdall.desktop packaging/linux/heimdall.png AppDir/
          ln -s usr/bin/heimdall AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream \
            --runtime-file runtime AppDir "dist/Heimdall-$version-x86_64.AppImage"
          ls -la dist
      - name: Check the Linux packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          shellcheck packaging/linux/install.sh packaging/linux/uninstall.sh
          desktop-file-validate packaging/linux/heimdall.desktop

          # The .deb installs here with every dependency found, and removes.
          sudo apt-get install -y --no-install-recommends ./dist/heimdall_*_amd64.deb
          test -x /usr/bin/heimdall
          test -f /usr/share/icons/hicolor/512x512/apps/heimdall.png
          desktop-file-validate /usr/share/applications/heimdall.desktop
          sudo apt-get remove -y heimdall
          test ! -e /usr/bin/heimdall

          # install.sh and uninstall.sh, in a throwaway home.
          home=$(mktemp -d)
          tar xzf dist/heimdall-*-linux-x86_64.tar.gz -C "$home"
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME HOME="$home" sh "$home"/heimdall-*/install.sh
          entry="$home/.local/share/applications/heimdall.desktop"
          test -x "$home/.local/bin/heimdall"
          test -f "$home/.local/share/icons/hicolor/512x512/apps/heimdall.png"
          grep -qx "Exec=\"$home/.local/bin/heimdall\"" "$entry"
          desktop-file-validate "$entry"
          env -u XDG_DATA_HOME -u XDG_CONFIG_HOME HOME="$home" sh "$home/.local/share/heimdall/uninstall.sh"
          test ! -e "$home/.local/bin/heimdall"
          test ! -e "$entry"
          test ! -e "$home/.local/share/heimdall"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Hash
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\nVerify the download as described in [SECURITY.md](https://github.com/%s/blob/main/SECURITY.md#verifying-a-release).\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/heimdall.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Heimdall $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
