# Every push to main and every pull request: format, lints, tests and a
# release build on Windows and Linux; dependency advisories and licenses;
# and a short fuzzing pass over everything that reads untrusted bytes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test (Windows)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p heimdall-app

  check-linux:
    name: Lint and test (Linux)
    # The oldest supported runner: binaries built here run on any newer
    # glibc (Ubuntu 22.04, Debian 12, Fedora 36 and later).
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p heimdall-app

  deny:
    name: Advisories, licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  fuzz:
    name: Fuzz (smoke, 60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Run every target
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
