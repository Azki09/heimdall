<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0E}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;outline:none}
a{color:#8A8A8A;text-decoration:none}a:hover{color:#E4E4E4}
</style>
</helmet>
<div style="width: 1100px; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; background: #141414; color: #E4E4E4; font-family: Inter, 'Segoe UI', sans-serif; border: 1px solid #262626; border-radius: 8px; overflow: hidden">

  <div style="height: 44px; display: flex; align-items: center; padding-left: 14px; flex-shrink: 0">
    <svg width="16" height="16" viewBox="0 0 40 40" fill="none" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round" aria-hidden="true" style="margin-right: 10px"><path d="M7 34V14M33 34V14M7 15C14 6 26 6 33 15M7 25H33"></path></svg>
    <span style="font-size: 12px; color: #8A8A8A">Create vault</span>
    <div style="flex-grow: 1"></div>
    <button aria-label="Minimize" style="width: 46px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" stroke="#8A8A8A" aria-hidden="true"><path d="M0 5H10"></path></svg></button>
    <button aria-label="Maximize" style="width: 46px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#8A8A8A" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"></rect></svg></button>
    <button aria-label="Close" style="width: 46px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" stroke="#8A8A8A" aria-hidden="true"><path d="M0 0L10 10M10 0L0 10"></path></svg></button>
  </div>

  <div style="flex-grow: 1; display: flex; min-height: 0">

    <div style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 40px 32px; border-right: 1px solid #222222; display: flex; flex-direction: column; gap: 18px; font-size: 13px">
      <div style="display: flex; align-items: center; gap: 12px; color: #8A8A8A"><span style="width: 16px; height: 16px; border-radius: 8px; background: #2E2E2E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#B8B8B8" stroke-width="1.5" aria-hidden="true"><path d="M2.5 6.5L5 9L9.5 3.5"></path></svg></span>Name</div>
      <div style="display: flex; align-items: center; gap: 12px; color: #8A8A8A"><span style="width: 16px; height: 16px; border-radius: 8px; background: #2E2E2E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#B8B8B8" stroke-width="1.5" aria-hidden="true"><path d="M2.5 6.5L5 9L9.5 3.5"></path></svg></span>Profile</div>
      <div style="display: flex; align-items: center; gap: 12px; color: #E4E4E4"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #E4E4E4"></span>Password</div>
      <div style="display: flex; align-items: center; gap: 12px; color: #7A7A7A"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #3A3A3A"></span>USB key</div>
      <div style="display: flex; align-items: center; gap: 12px; color: #7A7A7A"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #3A3A3A"></span>Recovery code</div>
      <div style="display: flex; align-items: center; gap: 12px; color: #7A7A7A"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #3A3A3A"></span>Confirm</div>
    </div>

    <div style="flex-grow: 1; box-sizing: border-box; padding: 56px 72px 40px; display: flex; flex-direction: column">
      <div style="width: 460px; display: flex; flex-direction: column">
        <h1 style="margin: 0 0 10px; font-size: 22px; font-weight: 500">Create a password</h1>
        <p style="margin: 0 0 32px; font-size: 14px; line-height: 22px; color: #8A8A8A">A few unrelated words make a strong password that is easy to remember. Nobody can reset it for you.</p>

        <label for="pw1" style="font-size: 12px; color: #8A8A8A; margin-bottom: 8px">Password</label>
        <div style="height: 42px; display: flex; align-items: center; background: #1B1B1B; border: 1px solid #2C2C2C; border-radius: 6px; padding: 0 6px 0 12px; margin-bottom: 10px">
          <input id="pw1" type="password" value="lantern orbit velvet canyon" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; color: #E4E4E4; font-size: 14px; letter-spacing: 2px">
          <button aria-label="Show password" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#7A7A7A" stroke-width="1.2" aria-hidden="true"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"></path><circle cx="8" cy="8" r="2"></circle></svg>
          </button>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 28px">
          <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
            <span style="height: 3px; border-radius: 2px; background: #B8B8B8"></span>
            <span style="height: 3px; border-radius: 2px; background: #B8B8B8"></span>
            <span style="height: 3px; border-radius: 2px; background: #B8B8B8"></span>
            <span style="height: 3px; border-radius: 2px; background: #2E2E2E"></span>
          </div>
          <span style="font-size: 12px; color: #8A8A8A; width: 140px; text-align: right">Strong · centuries to guess</span>
        </div>

        <label for="pw2" style="font-size: 12px; color: #8A8A8A; margin-bottom: 8px">Confirm password</label>
        <div style="height: 42px; display: flex; align-items: center; background: #1B1B1B; border: 1px solid #4A4A4A; border-radius: 6px; padding: 0 12px; margin-bottom: 10px">
          <input id="pw2" type="password" value="lantern orbit velvet canyon" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; color: #E4E4E4; font-size: 14px; letter-spacing: 2px">
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8A8A8A">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#6E9C7A" stroke-width="1.5" aria-hidden="true"><path d="M2.5 6.5L5 9L9.5 3.5"></path></svg>
          <span>Passwords match</span>
        </div>
      </div>

      <div style="flex-grow: 1"></div>

      <div style="display: flex; align-items: center; gap: 12px">
        <button style="height: 40px; padding: 0 18px; border: 1px solid #2C2C2C; border-radius: 6px; font-size: 14px; color: #B8B8B8">Back</button>
        <div style="flex-grow: 1"></div>
        <button style="height: 40px; padding: 0 22px; border-radius: 6px; background: #E4E4E4; color: #141414; font-size: 14px; font-weight: 500">Continue</button>
      </div>
    </div>

  </div>
</div>
</x-dc>
