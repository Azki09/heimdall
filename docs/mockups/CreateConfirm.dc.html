<div style="width: 1100px; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; background: #141414; color: #E4E4E4; font-family: Inter, 'Segoe UI', sans-serif; border: 1px solid #262626; border-radius: 8px; overflow: hidden">

  <div style="height: 44px; display: flex; align-items: center; padding-left: 14px; flex-shrink: 0">

      <div style="display: flex; align-items: center; gap: 12px; color: #8A8A8A"><span style="width: 16px; height: 16px; border-radius: 8px; background: #2E2E2E; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#B8B8B8" stroke-width="1.5" aria-hidden="true"><path d="M2.5 6.5L5 9L9.5 3.5"></path></svg></span>USB key</div>

      <div style="display: flex; align-items: center; gap: 12px; color: #E4E4E4"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #E4E4E4"></span>Confirm</div>
    </div>

    <div style="flex-grow: 1; box-sizing: border-box; padding: 56px 72px 40px; display: flex; flex-direction: column">
      <div style="width: 460px; display: flex; flex-direction: column">
        <h1 style="margin: 0 0 10px; font-size: 22px; font-weight: 500">Confirm your recovery code</h1>
        <p style="margin: 0 0 32px; font-size: 14px; line-height: 22px; color: #8A8A8A">Type these three words from your sheet, so we know it was written down correctly.</p>

        <div style="display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 16px">
            <label for="w3" style="width: 64px; font-size: 13px; color: #8A8A8A">Word 3</label>

              <input id="w3" type="text" value="oxygen" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; color: #E4E4E4; font-size: 15px; font-family: 'JetBrains Mono', Consolas, monospace">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#6E9C7A" stroke-width="1.5" aria-label="Correct" role="img"><path d="M2.5 6.5L5 9L9.5 3.5"></path></svg>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 16px">
            <label for="w7" style="width: 64px; font-size: 13px; color: #8A8A8A">Word 7</label>

            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 16px">
            <label for="w11" style="width: 64px; font-size: 13px; color: #8A8A8A">Word 11</label>
            <div style="flex-grow: 1; height: 42px; display: flex; align-items: center; background: #1B1B1B; border: 1px solid #2C2C2C; border-radius: 6px; padding: 0 12px">
              <input id="w11" type="text" value="" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; color: #E4E4E4; font-size: 15px; font-family: 'JetBrains Mono', Consolas, monospace">
            </div>
          </div>
        </div>
      </div>

      <div style="flex-grow: 1"></div>

      <div style="display: flex; align-items: center; gap: 12px">
        <button style="height: 40px; padding: 0 18px; border: 1px solid #2C2C2C; border-radius: 6px; font-size: 14px; color: #B8B8B8">Show the words again</button>
        <div style="flex-grow: 1"></div>
        <button disabled style="height: 40px; padding: 0 22px; border-radius: 6px; background: #2A2A2A; color: #7A7A7A; font-size: 14px; font-weight: 500; cursor: default">Create vault</button>
